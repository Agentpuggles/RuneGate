<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #00ff88; overflow: hidden; }
  #score { font-size: 18px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
  canvas { border: 2px solid rgba(0,255,136,0.3); border-radius: 8px; }
  #info { font-size: 11px; color: #6b7280; margin-top: 10px; }
  #overlay { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,5,16,0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(0,255,136,0.3); z-index: 10; }
  #overlay h2 { margin-bottom: 10px; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
  #overlay p { font-size: 14px; color: #6b7280; margin-bottom: 15px; text-align: center; }
  #overlay button { padding: 10px 30px; background: rgba(0,255,136,0.2); border: 1px solid rgba(0,255,136,0.5); color: #00ff88; font-family: 'Courier New', monospace; font-size: 16px; border-radius: 8px; cursor: pointer; }
  #overlay button:hover { background: rgba(0,255,136,0.3); }
</style>
</head>
<body>
  <div id="score">Coins: 0</div>
  <canvas id="c" width="600" height="350"></canvas>
  <div id="info">← → Move | Space/↑ Jump</div>
  <div id="overlay"><h2>🏃 Pixel Quest</h2><p>Navigate treacherous pixel platforms</p><button onclick="startGame()">Start Game</button></div>
  <script>
    const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
    let player,platforms,coins,camera,score,gameOver,keys,particles;

    function init(){
      player={x:50,y:200,w:20,h:24,vx:0,vy:0,grounded:false,speed:4,jump:-10};
      camera={x:0};
      score=0;gameOver=false;keys={};particles=[];
      platforms=[
        {x:0,y:300,w:600,h:50},{x:250,y:250,w:80,h:15},{x:400,y:200,w:80,h:15},
        {x:550,y:150,w:80,h:15},{x:700,y:200,w:120,h:15},{x:900,y:280,w:200,h:50},
        {x:1150,y:220,w:80,h:15},{x:1300,y:160,w:80,h:15},{x:1450,y:100,w:80,h:15},
        {x:1600,y:200,w:200,h:50},{x:1850,y:150,w:80,h:15},{x:2000,y:100,w:100,h:15},
        {x:2200,y:250,w:200,h:50},{x:2450,y:180,w:80,h:15},{x:2600,y:120,w:80,h:15},
        {x:2800,y:250,w:300,h:50}
      ];
      coins=[
        {x:280,y:220},{x:430,y:170},{x:580,y:120},{x:740,y:170},
        {x:1180,y:190},{x:1330,y:130},{x:1480,y:70},{x:1880,y:120},{x:2030,y:70},
        {x:2480,y:150},{x:2630,y:90}
      ].map(c=>({...c,collected:false}));
    }

    function startGame(){document.getElementById('overlay').style.display='none';init();requestAnimationFrame(loop);}

    function loop(){
      if(gameOver){document.getElementById('overlay').style.display='flex';document.getElementById('overlay').innerHTML=`<h2>💀 Quest Failed</h2><p>Coins: ${score}</p><button onclick="startGame()">Try Again</button>`;return;}
      update();draw();requestAnimationFrame(loop);
    }

    function update(){
      const p=player;
      if(keys['ArrowLeft']||keys['a'])p.vx=-p.speed;
      else if(keys['ArrowRight']||keys['d'])p.vx=p.speed;
      else p.vx*=0.8;

      if((keys[' ']||keys['ArrowUp']||keys['w'])&&p.grounded){p.vy=p.jump;p.grounded=false;}

      p.vy+=0.5; // gravity
      p.x+=p.vx;p.y+=p.vy;
      p.grounded=false;

      platforms.forEach(pl=>{
        if(p.x+p.w>pl.x&&p.x<pl.x+pl.w){
          if(p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h&&p.vy>=0){
            p.y=pl.y-p.h;p.vy=0;p.grounded=true;
          }
        }
      });

      coins.forEach(co=>{
        if(!co.collected&&Math.abs(p.x+p.w/2-co.x)<20&&Math.abs(p.y+p.h/2-co.y)<20){
          co.collected=true;score++;
          for(let i=0;i<6;i++)particles.push({x:co.x,y:co.y,dx:(Math.random()-0.5)*3,dy:(Math.random()-0.5)*3,life:20,color:'#ffd700'});
        }
      });

      particles=particles.filter(pt=>{pt.x+=pt.dx;pt.y+=pt.dy;pt.life--;return pt.life>0;});

      camera.x=p.x-W/3;
      if(p.y>H+50)gameOver=true;

      document.getElementById('score').textContent=`Coins: ${score}/${coins.length}`;
      if(coins.every(c=>c.collected)){gameOver=true;document.getElementById('overlay').innerHTML=`<h2>🏆 Quest Complete!</h2><p>All coins collected!</p><button onclick="startGame()">Play Again</button>`;}
    }

    function draw(){
      ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);

      // Stars
      for(let i=0;i<30;i++){ctx.fillStyle=`rgba(255,255,255,${0.05+Math.random()*0.1})`;ctx.fillRect((i*137-camera.x*0.1)%W,(i*89)%H,1,1);}

      ctx.save();ctx.translate(-camera.x,0);

      // Platforms
      platforms.forEach(pl=>{
        ctx.fillStyle='#1a1a3e';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
        ctx.fillStyle='#7b2ff7';ctx.fillRect(pl.x,pl.y,pl.w,3);
      });

      // Coins
      coins.forEach(co=>{
        if(!co.collected){
          ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=10;
          ctx.beginPath();ctx.arc(co.x,co.y,8,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;
        }
      });

      // Player
      ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=12;
      ctx.fillRect(player.x,player.y,player.w,player.h);
      // Eyes
      ctx.fillStyle='#050510';ctx.fillRect(player.x+4,player.y+6,4,4);ctx.fillRect(player.x+12,player.y+6,4,4);
      ctx.shadowBlur=0;

      // Particles
      particles.forEach(pt=>{ctx.globalAlpha=pt.life/20;ctx.fillStyle=pt.color;ctx.fillRect(pt.x-2,pt.y-2,4,4);});
      ctx.globalAlpha=1;

      ctx.restore();
    }

    document.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();});
    document.addEventListener('keyup',e=>{keys[e.key]=false;});
    init();
  </script>
</body>
</html>
