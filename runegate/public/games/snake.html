<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Serpent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #00ff88;
    overflow: hidden;
  }
  #gameCanvas {
    border: 2px solid rgba(0,255,136,0.3);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,255,136,0.1);
  }
  #score {
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(0,255,136,0.5);
  }
  #info {
    font-size: 12px;
    color: #6b7280;
    margin-top: 10px;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,16,0.9);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid rgba(0,255,136,0.3);
  }
  #overlay h2 { font-size: 24px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
  #overlay p { font-size: 14px; color: #6b7280; margin-bottom: 15px; }
  #overlay button {
    padding: 10px 30px;
    background: rgba(0,255,136,0.2);
    border: 1px solid rgba(0,255,136,0.5);
    color: #00ff88;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
  }
  #overlay button:hover {
    background: rgba(0,255,136,0.3);
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
  }
</style>
</head>
<body>
  <div id="score">Score: 0 | Length: 3</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="info">Arrow Keys / WASD to move | P to pause</div>

  <div id="overlay">
    <h2>🐍 Neon Serpent</h2>
    <p>Guide the cyber-serpent through the digital void</p>
    <button onclick="startGame()">Start Game</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake, food, direction, score, gameLoop, paused, gameOver;

    function init() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      direction = {x:1,y:0};
      score = 0;
      paused = false;
      gameOver = false;
      placeFood();
      updateScore();
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
      };
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) placeFood();
      }
    }

    function startGame() {
      overlay.style.display = 'none';
      init();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function update() {
      if (paused || gameOver) return;
      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame(); return;
      }
      for (let s of snake) {
        if (s.x === head.x && s.y === head.y) { endGame(); return; }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        placeFood();
        updateScore();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(0,255,136,0.03)';
      for (let i = 0; i < tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i*gridSize, 0);
        ctx.lineTo(i*gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i*gridSize);
        ctx.lineTo(canvas.width, i*gridSize);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(food.x*gridSize+gridSize/2, food.y*gridSize+gridSize/2, gridSize/2-2, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((s, i) => {
        const alpha = 1 - (i / snake.length) * 0.6;
        if (i === 0) {
          ctx.fillStyle = '#00ff88';
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = `rgba(0,255,136,${alpha})`;
          ctx.shadowBlur = 5;
        }
        ctx.fillRect(s.x*gridSize+1, s.y*gridSize+1, gridSize-2, gridSize-2);
      });
      ctx.shadowBlur = 0;
    }

    function updateScore() {
      scoreEl.textContent = `Score: ${score} | Length: ${snake.length}`;
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <h2>💀 Game Over</h2>
        <p>Score: ${score} | Length: ${snake.length}</p>
        <button onclick="startGame()">Play Again</button>
      `;
    }

    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (direction.y !== 1) direction = {x:0,y:-1}; break;
        case 'ArrowDown': case 's': case 'S':
          if (direction.y !== -1) direction = {x:0,y:1}; break;
        case 'ArrowLeft': case 'a': case 'A':
          if (direction.x !== 1) direction = {x:-1,y:0}; break;
        case 'ArrowRight': case 'd': case 'D':
          if (direction.x !== -1) direction = {x:1,y:0}; break;
        case 'p': case 'P':
          paused = !paused; break;
      }
    });

    init();
    draw();
  </script>
</body>
</html>
